<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>MCP Hub — 交互原型</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#f6f6f4; --panel:#ffffff; --line:#e3e2dd; --line-strong:#cfcec7;
    --text:#22221f; --muted:#6b6a64; --hint:#918f88;
    --accent:#534AB7; --accent-soft:#EEEDFE;
    --green:#1D9E75; --green-soft:#E1F5EE;
    --amber:#BA7517; --amber-soft:#FAEEDA;
    --red:#A32D2D; --red-soft:#FCEBEB;
    --blue:#185FA5; --blue-soft:#E6F1FB;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:13px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;}
  #app{display:flex;min-height:100vh}

  aside{width:196px;flex:0 0 196px;background:var(--panel);border-right:1px solid var(--line);
    padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto}
  .brand{font-size:14px;font-weight:600;padding:0 8px 14px;letter-spacing:.2px}
  .brand small{display:block;font-weight:400;font-size:11px;color:var(--hint);letter-spacing:0}
  nav button{display:block;width:100%;text-align:left;padding:8px 10px;margin-bottom:2px;
    border:0;border-radius:8px;background:transparent;color:var(--muted);font:inherit;cursor:pointer}
  nav button:hover{background:#f2f1ec;color:var(--text)}
  nav button.on{background:var(--accent-soft);color:#26215C;font-weight:500}
  .navsec{font-size:11px;color:var(--hint);padding:14px 10px 6px;letter-spacing:.4px}

  main{flex:1;min-width:0;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  header .lbl{font-size:12px;color:var(--hint)}
  select,input[type=text]{font:inherit;font-size:12px;padding:5px 8px;border:1px solid var(--line-strong);
    border-radius:7px;background:#fff;color:var(--text)}
  .spacer{flex:1}
  .btn{font:inherit;font-size:12px;padding:6px 12px;border-radius:8px;border:1px solid var(--line-strong);
    background:#fff;color:var(--text);cursor:pointer}
  .btn:hover{border-color:#b9b7ae}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:#4750a5}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}

  .view{padding:18px 20px 40px;max-width:1180px}
  h1{font-size:15px;font-weight:600;margin:0 0 4px}
  h2{font-size:13px;font-weight:600;margin:22px 0 8px}
  p.sub{color:var(--muted);margin:0 0 14px;font-size:12px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .card .hd{padding:10px 14px;border-bottom:1px solid var(--line);font-weight:500;font-size:12px;
    display:flex;align-items:center;gap:8px}

  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
  th{font-weight:500;color:var(--muted);background:#fbfbf9;font-size:11px;white-space:nowrap}
  tr:last-child td{border-bottom:0}
  td.mono,pre,.mono{font-family:var(--mono);font-size:11.5px}

  .matrix th.ag{text-align:center;min-width:82px}
  .tablewrap{overflow-x:auto;overscroll-behavior-x:contain}
  .matrix{min-width:1420px}
  .matrix th:first-child,.matrix td:first-child{min-width:236px}
  .matrix th:first-child,.matrix td:first-child{position:sticky;left:0;z-index:2;background:#fff}
  .matrix th:first-child{background:#fbfbf9;z-index:3}
  .matrix td:first-child{box-shadow:1px 0 0 var(--line)}
  .matrix td.c{text-align:center;padding:4px}
  .cell{width:100%;height:38px;border:1px solid transparent;border-radius:8px;background:transparent;
    cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
  .cell:hover{background:#f4f3ef}
  .cell.sel{background:var(--accent-soft);border-color:#CECBF6}
  .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
  .dot.ok{background:var(--green)}
  .dot.absent{background:#fff;border:1px solid #b4b2a9}
  .dot.diff{background:var(--amber)}
  .ck{font-size:11px;color:var(--accent);width:12px}

  .bottombar{position:sticky;bottom:0;display:flex;align-items:center;gap:12px;
    padding:10px 16px;background:var(--accent-soft);border-top:1px solid #CECBF6;border-radius:0 0 12px 12px}
  .bottombar .cnt{font-weight:500;color:#26215C;font-size:12px}
  .bottombar .hint{color:#534AB7;font-size:11px}

  .legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:11.5px}
  .legend span{display:flex;align-items:center;gap:6px}

  .banner{padding:9px 12px;border-radius:9px;font-size:12px;margin-bottom:14px;
    background:var(--blue-soft);color:#042C53;border:1px solid #B5D4F4}
  .banner.warn{background:var(--amber-soft);color:#412402;border-color:#FAC775}
  .banner.ok{background:var(--green-soft);color:#04342C;border-color:#9FE1CB}

  .split{display:grid;grid-template-columns:260px 1fr;gap:14px}
  .list{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .list button{display:block;width:100%;text-align:left;padding:10px 12px;border:0;border-bottom:1px solid var(--line);
    background:transparent;font:inherit;cursor:pointer}
  .list button:last-child{border-bottom:0}
  .list button:hover{background:#f7f6f2}
  .list button.on{background:var(--accent-soft)}
  .list .nm{font-weight:500;font-size:12px}
  .list .ds{color:var(--hint);font-size:11px}
  .tag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:5px;background:#f1efe8;
    color:var(--muted);margin-right:4px}
  .tag.b{background:var(--blue-soft);color:#042C53}
  .tag.g{background:var(--green-soft);color:#04342C}

  pre{margin:0;padding:10px 12px;background:#fbfbf9;border:1px solid var(--line);border-radius:8px;
    overflow:auto;line-height:1.55;max-height:340px;white-space:pre}
  .kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:12px;padding:12px 14px}
  .kv dt{color:var(--hint)}
  .kv dd{margin:0}
  .pill{font-size:10.5px;padding:1px 7px;border-radius:20px;border:1px solid var(--line-strong);color:var(--muted)}
  .pill.ok{background:var(--green-soft);border-color:#9FE1CB;color:#04342C}
  .pill.warn{background:var(--amber-soft);border-color:#FAC775;color:#412402}
  .pill.bad{background:var(--red-soft);border-color:#F7C1C1;color:#501313}
  .pill.info{background:var(--blue-soft);border-color:#B5D4F4;color:#042C53}

  .diffgrp{margin-bottom:14px}
  .diffhd{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fbfbf9;
    border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;font-size:12px}
  .diffgrp pre{border-radius:0 0 10px 10px;max-height:260px}
  .warnline{color:var(--amber);font-size:11.5px;padding:6px 12px;background:var(--amber-soft);
    border:1px solid #FAC775;border-top:0;font-family:var(--mono)}
  .note{color:var(--hint);font-size:11.5px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:980px){.split{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
  .hidden{display:none !important}
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="brand">MCP Hub<small>多客户端配置中枢 · 原型</small></div>
    <nav id="nav"></nav>
    <div class="navsec">当前目标</div>
    <div style="padding:0 10px;font-size:11.5px;color:var(--muted)" id="targetInfo"></div>
  </aside>
  <main>
    <header id="topbar"></header>
    <section class="view" id="view"></section>
  </main>
</div>

<script>
(function(){
  'use strict';

  /* ---------------- 数据：模拟真实调研结果 ---------------- */
  /* scopes：该 Agent 支持的作用域；paths：各作用域对应的配置文件 */
  var AGENTS = [
    {id:'claude-code', name:'Claude Code', kind:'CLI', format:'json', root:'mcpServers', urlKey:'url',
     secret:'dollar', cli:'claude', state:'ok',
     scopes:['user','project','local'],
     paths:{user:'C:\\Users\\Chensh\\.claude.json',
            project:'<proj>\\.mcp.json',
            local:'~/.claude.json › projects.<proj>'}},
    {id:'codex', name:'Codex CLI', kind:'CLI', format:'toml', root:'mcp_servers', urlKey:'url',
     secret:'native', cli:'codex', state:'ok',
     scopes:['user','project'],
     paths:{user:'C:\\Users\\Chensh\\.codex\\config.toml',
            project:'<proj>\\.codex\\config.toml'}},
    {id:'workbuddy', name:'WorkBuddy', kind:'CLI', format:'json', root:'mcpServers', urlKey:'url',
     secret:'literal', cli:'(内置)', state:'nofile',
     scopes:['user'],
     paths:{user:'C:\\Users\\Chensh\\.workbuddy\\mcp.json'}},
    {id:'kimi-code', name:'Kimi Code', kind:'CLI', format:'json', root:'mcpServers', urlKey:'url',
     secret:'literal', cli:'kimi', state:'ok',
     scopes:['user'],
     paths:{user:'C:\\Users\\Chensh\\.kimi-code\\mcp.json'}},
    {id:'opencode', name:'OpenCode', kind:'CLI', format:'jsonc', root:'mcp.servers', urlKey:'url',
     secret:'brace', cli:'opencode', state:'ok',
     scopes:['user','project'],
     paths:{user:'C:\\Users\\Chensh\\.config\\opencode\\opencode.json',
            project:'<proj>\\opencode.json'}},
    {id:'vscode', name:'VS Code', kind:'IDE', format:'json', root:'servers', urlKey:'url',
     secret:'literal', cli:'code', state:'nofile',
     scopes:['user','project'],
     paths:{user:'%APPDATA%\\Code\\User\\mcp.json',
            project:'<proj>\\.vscode\\mcp.json'}},
    {id:'antigravity', name:'Antigravity', kind:'IDE', format:'json', root:'mcpServers', urlKey:'serverUrl',
     secret:'literal', cli:'agy', state:'ok',
     scopes:['user','project'],
     paths:{user:'C:\\Users\\Chensh\\.gemini\\config\\mcp_config.json',
            project:'<proj>\\.agents\\mcp_config.json'}},
    {id:'grok', name:'Grok', kind:'CLI', format:'toml', root:'mcp_servers', urlKey:'url',
     secret:'dollar', cli:'grok', state:'orphan',
     scopes:['user','project'],
     paths:{user:'C:\\Users\\Chensh\\.grok\\config.toml',
            project:'<proj>\\.grok\\config.toml'}},
    {id:'cursor', name:'Cursor', kind:'IDE', format:'json', root:'mcpServers', urlKey:'url',
     secret:'literal', cli:'cursor', state:'nofile',
     scopes:['user'],
     paths:{user:'C:/Users/Chensh/.cursor/mcp.json'}},
    {id:'cline', name:'Cline', kind:'IDE', format:'json', root:'mcpServers', urlKey:'url',
     secret:'literal', cli:'(扩展)', state:'ok',
     scopes:['user'],
     paths:{user:'C:/Users/Chensh/.cline/data/settings/cline_mcp_settings.json'}},
    {id:'gemini-cli', name:'Gemini CLI', kind:'CLI', format:'json', root:'mcpServers', urlKey:'url',
     secret:'literal', cli:'gemini', state:'nofile',
     scopes:['user'],
     paths:{user:'C:/Users/Chensh/.gemini/settings.json'}},
    {id:'claude-desktop', name:'Claude Desktop', kind:'Desktop', format:'json', root:'mcpServers', urlKey:'url',
     secret:'literal', cli:'(App)', state:'nofile',
     scopes:['user'],
     paths:{user:'%APPDATA%/Claude/claude_desktop_config.json'}},
    {id:'windsurf', name:'Windsurf', kind:'IDE', format:'json', root:'mcpServers', urlKey:'serverUrl',
     secret:'dollarEnv', cli:'windsurf', state:'nofile',
     scopes:['user'],
     paths:{user:'C:/Users/Chensh/.codeium/windsurf/mcp_config.json'}},
    {id:'trae', name:'Trae', kind:'IDE', format:'json', root:'mcpServers', urlKey:'url',
     secret:'literal', cli:'trae', state:'nofile',
     scopes:['user','project'],
     paths:{user:'%APPDATA%/Trae/User/settings/mcp.json',
            project:'<proj>/.trae/mcp.json'}}
  ];

  /* scope：inherit = 跟随顶部全局作用域；也可逐条覆盖 */
  var ENTRIES = [
    {name:'stockdb', desc:'本地行情数据库', transport:'stdio', command:'python',
     args:['-u','${PROJECT_ROOT}/ai_mcp/stockdb_full_mcp.py'],
     env:{STOCKDB_URL:'${ENV:STOCKDB_URL}'}, tags:['finance','local'], scope:'user',
     overrides:{windows:{command:'c:/Dev/stockdata/.venv/Scripts/python.exe'},
                linux:{command:'/home/dev/stockdata/.venv/bin/python'}}},
    {name:'context7', desc:'文档检索', transport:'http', url:'https://mcp.context7.com/mcp',
     auth:{type:'bearer', token_env:'CONTEXT7_API_KEY'}, tags:['docs'], scope:'inherit'},
    {name:'github', desc:'GitHub 仓库操作', transport:'http', url:'https://api.githubcopilot.com/mcp/',
     auth:{type:'bearer', token_env:'GITHUB_PAT'}, tags:['vcs'], scope:'project'},
    {name:'playwright', desc:'浏览器自动化', transport:'stdio', command:'npx',
     args:['-y','@playwright/mcp@latest'], tags:['test'], scope:'local'},
    {name:'filesystem', desc:'文件系统访问', transport:'stdio', command:'npx',
     args:['-y','@modelcontextprotocol/server-filesystem','${PROJECT_ROOT}'], tags:['local'], scope:'inherit'}
  ];

  /* 现有配置状态：configured / diff / absent */
  var PRE = {
    'stockdb::claude-code':'ok','stockdb::codex':'ok','stockdb::workbuddy':'ok',
    'stockdb::kimi-code':'ok','stockdb::opencode':'ok','stockdb::vscode':'ok',
    'context7::claude-code':'ok','context7::codex':'ok',
    'github::codex':'diff',
    'playwright::claude-code':'ok'
  };

  var BACKUPS = [
    {ts:'2026-10-26 14:08:12', agent:'Codex CLI', file:'~/.codex/config.toml', items:'github (修改)', size:'3.1 KB'},
    {ts:'2026-10-26 13:52:40', agent:'Claude Code', file:'~/.claude.json', items:'stockdb, context7 (新增)', size:'12.4 KB'},
    {ts:'2026-10-25 20:11:05', agent:'OpenCode', file:'~/.config/opencode/opencode.json', items:'stockdb (新增)', size:'2.7 KB'}
  ];

  var PAGES = [
    ['matrix','客户端配置'],['catalog','MCP配置'],['diff','差异预览'],
    ['detect','环境检测'],['backup','备份回滚'],['cli','命令行（Linux）']
  ];

  var SCOPE_LABEL = {user:'用户级', project:'项目级', local:'本地级', inherit:'跟随全局'};

  var state = {
    page:'matrix',
    platform:'windows',
    target:'local',
    scope:'user',
    secretPolicy:'ask',
    mergeMode:'merge',
    selected:{},
    curEntry:'github',
    applied:false
  };

  /* 默认选中：演示三档 bearer 映射 */
  ['stockdb::claude-code','stockdb::codex','stockdb::workbuddy','stockdb::kimi-code',
   'context7::claude-code','context7::opencode',
   'github::claude-code','github::codex','github::opencode','github::antigravity'
  ].forEach(function(k){ state.selected[k]=true; });

  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function agentById(id){
    for(var i=0;i<AGENTS.length;i++) if(AGENTS[i].id===id) return AGENTS[i];
    return null;
  }
  function entryByName(n){
    for(var i=0;i<ENTRIES.length;i++) if(ENTRIES[i].name===n) return ENTRIES[i];
    return null;
  }
  function platKey(){
    return state.platform==='macos' ? 'macos' : state.platform;
  }
  /* 条目的生效作用域：条目自带 scope 优先，inherit 则跟随顶部全局 */
  function effScope(entry){
    if(entry.scope && entry.scope!=='inherit') return entry.scope;
    return state.scope;
  }
  function supports(agent, scope){
    return (agent.scopes||[]).indexOf(scope) >= 0;
  }
  function pathOf(agent, scope){
    return (agent.paths && agent.paths[scope]) || '（该作用域不支持）';
  }
  function scopeBadge(entry){
    var s = effScope(entry);
    var own = entry.scope && entry.scope!=='inherit';
    return '<span class="tag '+(own?'b':'')+'" title="'+(own?'条目单独指定':'跟随顶部全局作用域')+'">'+
      SCOPE_LABEL[s]+(own?'':' ·继承')+'</span>';
  }
  function resolved(entry){
    var cmd = entry.command, args = entry.args || [];
    var o = entry.overrides && entry.overrides[platKey()];
    if(o){ if(o.command) cmd=o.command; if(o.args) args=o.args; }
    return {command:cmd, args:args};
  }
  /* 环境变量引用写法：dollar / brace / literal */
  function refText(agent, envName){
    if(agent.secret==='dollar') return '${'+envName+'}';
    if(agent.secret==='dollarEnv') return '${env:'+envName+'}';
    if(agent.secret==='brace') return '{env:'+envName+'}';
    return '<需内联:'+envName+'>';
  }

  /* 片段生成：模拟适配器编码结果 */
  function snippet(entry, agent){
    var remote = entry.transport!=='stdio';
    var r = resolved(entry);
    var lines = [];
    if(agent.format==='toml'){
      lines.push('[mcp_servers.'+entry.name+']');
      if(remote){
        lines.push('url = "'+entry.url+'"');
        if(entry.auth){
          if(agent.secret==='native'){
            lines.push('bearer_token_env_var = "'+entry.auth.token_env+'"');
          }else{
            lines.push('http_headers = { Authorization = "Bearer '+refText(agent,entry.auth.token_env)+'" }');
          }
        }
      }else{
        lines.push('command = "'+r.command+'"');
        lines.push('args = ['+r.args.map(function(a){return '"'+a+'"';}).join(', ')+']');
        if(entry.env) lines.push('env = { STOCKDB_URL = "'+entry.env.STOCKDB_URL+'" }');
        lines.push('startup_timeout_sec = 30');
      }
      return lines.join('\n');
    }
    /* JSON 系 */
    var inner = [];
    if(remote){
      if(agent.id==='antigravity'){
        inner.push('"serverUrl": "'+entry.url+'"');
      }else{
        inner.push('"type": "http"');
        inner.push('"url": "'+entry.url+'"');
      }
      if(entry.auth){
        inner.push('"headers": { "Authorization": "Bearer '+refText(agent,entry.auth.token_env)+'" }');
      }
    }else{
      if(agent.id==='opencode'){
        inner.push('"type": "local"');
        inner.push('"command": ['+[r.command].concat(r.args).map(function(a){return '"'+a+'"';}).join(', ')+']');
      }else{
        inner.push('"command": "'+r.command+'"');
        inner.push('"args": ['+r.args.map(function(a){return '"'+a+'"';}).join(', ')+']');
      }
      var envKey = (agent.id==='opencode') ? '"environment"' : '"env"';
      if(entry.env) inner.push(envKey+': { "STOCKDB_URL": "'+entry.env.STOCKDB_URL+'" }');
    }
    var entryBody = inner.join(',\n      ');
    if(agent.root==='mcp.servers'){
      return '{\n  "mcp": {\n    "servers": {\n      "'+entry.name+'": {\n      '+entryBody+'\n      }\n    }\n  }\n}';
    }
    return '{\n  "'+agent.root+'": {\n    "'+entry.name+'": {\n      '+entryBody+'\n    }\n  }\n}';
  }

  function warningsFor(entry, agent){
    var w = [];
    if(entry.auth && agent.secret==='literal'){
      w.push('该客户端 headers 只认字面值，无法展开变量 → 受 secret_policy 约束（当前：'+state.secretPolicy+'）');
    }
    if(entry.overrides && entry.overrides[platKey()]){
      w.push('已应用 '+platKey()+' 平台覆盖：command 已替换为 '+resolved(entry).command);
    }
    if(agent.id==='vscode'){
      w.push('VS Code 用户级根键是 servers（便携格式为 mcpServers），此处按用户级写入');
    }
    return w;
  }

  function selKeys(){ return Object.keys(state.selected).filter(function(k){return state.selected[k];}); }
  function countEntries(){
    var m={}; selKeys().forEach(function(k){ m[k.split('::')[0]]=1; });
    return Object.keys(m).length;
  }
  function countAgents(){
    var m={}; selKeys().forEach(function(k){ m[k.split('::')[1]]=1; });
    return Object.keys(m).length;
  }

  /* ---------------- 渲染 ---------------- */
  function renderNav(){
    var h = '';
    PAGES.forEach(function(p){
      h += '<button data-page="'+p[0]+'" class="'+(state.page===p[0]?'on':'')+'">'+p[1]+'</button>';
    });
    document.getElementById('nav').innerHTML = h;
    document.getElementById('targetInfo').innerHTML =
      state.target==='local' ? '本机 · 直接写入' : 'Bundle · 导出配置包';
  }

  function renderTop(){
    var plats = [['windows','Windows'],['macos','macOS'],['linux','Linux']];
    var opt = plats.map(function(p){
      return '<option value="'+p[0]+'"'+(state.platform===p[0]?' selected':'')+'>'+p[1]+'</option>';
    }).join('');
    var tg = [['local','本机'],['bundle','Bundle 导出']].map(function(t){
      return '<option value="'+t[0]+'"'+(state.target===t[0]?' selected':'')+'>'+t[1]+'</option>';
    }).join('');
    var sc = [['user','用户级'],['project','项目级'],['local','本地级']].map(function(s){
      return '<option value="'+s[0]+'"'+(state.scope===s[0]?' selected':'')+'>'+s[1]+'</option>';
    }).join('');
    document.getElementById('topbar').innerHTML =
      '<span class="lbl">目录</span>'+

  function yamlFor(e){
    var q = function(a){ return '"'+a+'"'; };
    var y = 'version: 1\nentries:\n';
    y += '  - name: ' + e.name + '\n';
    y += '    description: ' + (e.desc||'') + '\n';
    y += '    transport: ' + e.transport + '\n';
    if(e.scope && e.scope!=='inherit') y += '    scope: ' + e.scope + '\n';
    if(e.transport==='stdio'){
      y += '    command: ' + (e.command||'') + '\n';
      y += '    args: [' + (e.args||[]).map(q).join(', ') + ']\n';
      if(e.env && Object.keys(e.env).length){
        y += '    env:\n';
        Object.keys(e.env).forEach(function(k){ y += '      ' + k + ': ' + e.env[k] + '\n'; });
      }
      if(e.overrides){
        y += '    overrides:\n';
        ['windows','linux'].forEach(function(p){
          if(e.overrides[p]) y += '      ' + p + ':\n        command: ' + e.overrides[p].command + '\n';
        });
      }
    }else{
      y += '    url: ' + (e.url||'') + '\n';
      if(e.auth) y += '    auth:\n      type: bearer\n      token_env: ' + e.auth.token_env + '\n';
    }
    y += '    tags: [' + (e.tags||[]).join(', ') + ']';
    return y;
  }

  function viewDiff(){
    var keys = selKeys();
    if(!keys.length){
      return '<h1>差异预览</h1><p class="sub">还没有选中任何目标。回到「客户端配置」页勾选后再来。</p>'+
        '<div class="banner">未勾选 = 不写入。删除也必须在这里显式勾选。</div>';
    }
    /* 按 Agent × 作用域 分组：同一 Agent 的不同作用域落在不同文件 */
    var byAgent = {};
    var blocked = [];
    keys.forEach(function(k){
      var p = k.split('::');
      var a = agentById(p[1]), e2 = entryByName(p[0]);
      if(!a || !e2) return;
      var sc = effScope(e2);
      if(!supports(a, sc)){
        blocked.push(p[0]+' → '+a.name+'（不支持'+SCOPE_LABEL[sc]+'）');
        return;
      }
      byAgent[p[1]] = byAgent[p[1]] || {};
      (byAgent[p[1]][sc] = byAgent[p[1]][sc] || []).push(p[0]);
    });

    var groups = '';
    var warnCount = 0, fileCount = 0;
    Object.keys(byAgent).forEach(function(aid){
      var a = agentById(aid);
      Object.keys(byAgent[aid]).forEach(function(sc){
        fileCount++;
        var names = byAgent[aid][sc];
        groups += '<div class="diffgrp"><div class="diffhd">'+
          '<b>'+a.name+'</b>'+
          '<span class="pill info">'+SCOPE_LABEL[sc]+'</span>'+
          '<span class="pill">'+a.format.toUpperCase()+'</span>'+
          '<span class="mono" style="color:var(--hint)">'+esc(pathOf(a,sc))+'</span>'+
          '<div class="spacer"></div><span class="note">根键 '+a.root+'</span></div>';
        var chunks = '';
        names.forEach(function(nm){
          var e = entryByName(nm);
          var st = PRE[nm+'::'+aid] || 'absent';
          var mark = st==='absent' ? '新增' : (st==='ok' ? '无变化' : '修改');
          var cls = st==='absent' ? 'ok' : (st==='ok' ? '' : 'warn');
          chunks += '<div style="padding:8px 12px;background:#fff;border-left:1px solid var(--line);border-right:1px solid var(--line)">'+
            '<span class="pill '+cls+'">'+mark+'</span> <b class="mono">'+nm+'</b></div>'+
            '<pre style="border-radius:0;border-top:0">'+esc(snippet(e,a))+'</pre>';
          if(st==='ok'){
            chunks += '<div class="note" style="padding:6px 12px;border:1px solid var(--line);border-top:0;'+
              'border-radius:0 0 10px 10px">已与现有配置一致，本次跳过、不写入、不产生备份</div>';
          }
          warningsFor(e,a).forEach(function(w){
            if(w.indexOf('secret_policy')>=0) warnCount++;
            chunks += '<div class="warnline">! '+esc(w)+'</div>';
          });
        });
        groups += chunks + '</div>';
      });
    });

    var blockedBox = blocked.length
      ? '<div class="banner warn"><b>已跳过 '+blocked.length+' 项</b>（作用域不支持，不会写入）：<br>'+
        blocked.map(function(s){ return '<span class="mono">· '+esc(s)+'</span>'; }).join('<br>')+'</div>'
      : '';

    var policy = '<div class="card" style="margin-bottom:14px"><div class="hd">写入行为</div>'+
      '<div style="padding:12px 14px">'+
      '<div class="row" style="margin-bottom:8px">'+
      '<span class="lbl" style="width:132px;color:var(--hint)">覆盖方式</span>'+
      '<select id="mergeSel">'+
      [['merge','合并保留（推荐）— 同名条目只改清单声明的字段'],
       ['replace','整条替换 — 同名条目以清单为准，文件里多出的字段会被删掉']].map(function(m){
        return '<option value="'+m[0]+'"'+(state.mergeMode===m[0]?' selected':'')+'>'+m[1]+'</option>';
      }).join('')+
      '</select></div>'+
      '<div class="row" style="margin-bottom:8px">'+
      '<span class="lbl" style="width:132px;color:var(--hint)">密钥策略</span>'+
      '<select id="polSel">'+
      ['ask','inline','skip','fail'].map(function(p){
        var d = {ask:'ask — 应用时弹窗确认',inline:'inline — 解析环境变量写明文',
                 skip:'skip — 跳过该条并告警',fail:'fail — 报错终止'}[p];
        return '<option value="'+p+'"'+(state.secretPolicy===p?' selected':'')+'>'+d+'</option>';
      }).join('')+
      '</select>'+
      '<span class="note">当前有 <b>'+warnCount+'</b> 处需要内联的密钥</span></div>'+
      '<div class="note">没有列出的条目一律不动：文件里你自己加的其它 MCP 配置、以及清单里没声明的字段，都会原样保留。'+
      '标记「无变化」的条目已与现有配置一致，本次不会写入。</div>'+
      '</div></div>';

    var result = state.applied
      ? '<div class="banner ok"><b>写入完成</b>（模拟）<br>'+
        '已写入 '+fileCount+' 个配置文件 · 备份至 <span class="mono">~/.mcp-hub/backups/20261026-141012/</span><br>'+
        '写后校验通过 · 审计日志已记录（不含密钥值）'+
        (warnCount?'<br>内联密钥 '+warnCount+' 处已按 '+state.secretPolicy+' 处理，备份目录权限 0700':'')+
        '</div>'
      : '';

    return '<h1>差异预览</h1>'+
      '<p class="sub">逐文件展示将要发生的变化。同一客户端的不同作用域是不同文件，分开列出。'+
      '同名条目按字段合并（清单没声明的字段保留）；清单外的条目一律不动。</p>'+

      '<button class="btn" id="backMatrix">返回客户端配置</button>'+
      (state.applied?'<button class="btn" onclick="0">查看备份</button>':'')+
      '</div>';
  }

  /* 表单字段 → 清单条目（实时） */
  function applyField(e, f, val){
    if(f==='name'){ e.name = val; state.curEntry = val; }
    else if(f==='desc'){ e.desc = val; }
    else if(f==='command'){ e.command = val; }
    else if(f==='args'){
      e.args = val.split(',').map(function(s){ return s.trim(); }).filter(Boolean);
    }
    else if(f==='env'){
      var o = {};
      val.split(',').forEach(function(kv){
        var p = kv.split('=');
        if(p[0] && p[0].trim()) o[p[0].trim()] = (p[1]||'').trim();
      });
      e.env = Object.keys(o).length ? o : null;
    }
    else if(f==='url'){ e.url = val; }
    else if(f==='scope'){ e.scope = val; }
    else if(f==='tokenEnv'){ e.auth = val.trim() ? {type:'bearer', token_env: val.trim()} : null; }
    else if(f==='tags'){
      e.tags = val.split(',').map(function(s){ return s.trim(); }).filter(Boolean);
    }
    var y = document.getElementById('yamlBox');
    if(y) y.textContent = yamlFor(e);
    var nm = document.getElementById('curListName');
    if(nm){
      nm.textContent = e.name;
      if(f==='desc' && nm.nextElementSibling) nm.nextElementSibling.textContent = e.desc;
    }
  }

      return '<tr><td class="mono">'+b.ts+'</td><td>'+b.agent+'</td>'+
        '<td class="mono">'+esc(b.file)+'</td><td>'+b.items+'</td><td class="mono">'+b.size+'</td>'+
        '<td><button class="btn ghost" style="padding:2px 8px">回滚</button></td></tr>';
    }).join('');
    return '<h1>备份与回滚</h1>'+
      '<p class="sub">每次写入前自动备份原文，可回滚到任意时间点。</p>'+
      '<div class="banner warn">备份是完整原文拷贝，可能含内联密钥 → 目录权限 0700，默认保留 30 天（可配置）。</div>'+
      '<div class="card"><div class="hd">备份记录</div><table>'+
      '<thead><tr><th>时间</th><th>客户端</th><th>文件</th><th>变更条目</th><th>大小</th><th></th></tr></thead>'+
      '<tbody>'+rows+'</tbody></table></div>'+
      '<h2>审计日志</h2>'+
      '<pre>'+[
        ['2026-10-26 14:10:12','apply','codex','~/.codex/config.toml','+1 ~1','内联密钥:1'],
        ['2026-10-26 14:10:12','apply','claude-code','~/.claude.json','+2',''],
        ['2026-10-26 14:08:12','apply','opencode','~/.config/opencode/opencode.json','+1',''],
        ['2026-10-26 13:52:40','rollback','claude-code','~/.claude.json','restore','13:52:39']
      ].map(function(r){
        return pad(r[0],21)+pad(r[1],10)+pad(r[2],14)+pad(r[3],36)+pad(r[4],9)+r[5];
      }).join('\n')+'</pre>';
  }

  function viewCli(){
    return '<h1>命令行（Linux / 服务器 / CI）</h1>'+
      '<p class="sub">Linux 仅提供 CLI，没有 GUI。与 GUI 共用同一套 Core，编码与写入行为完全一致。</p>'+
      '<div class="banner">安装：下载 <span class="mono">mcp-hub-cli</span>（musl 静态单文件），'+
      '<span class="mono">scp</span> 到服务器即可运行，无需任何运行库。</div>'+

      '<h2>预演（不改任何文件）</h2>'+
      '<pre>$ mcp-hub-cli diff --catalog customer-mcp.yaml --agent claude-code,codex\n'+
      'codex        ~/.codex/config.toml              +2 ~1\n'+
      'claude-code  ~/.claude.json                    +2\n'+
      '需要内联密钥 1 处（antigravity 不支持变量展开）</pre>'+

      '<h2>应用</h2>'+
      '<pre>$ mcp-hub-cli apply --catalog customer-mcp.yaml --agent claude-code,codex --yes\n'+
      'backup  ~/.mcp-hub/backups/20261026-141012/\n'+
      'write   ~/.codex/config.toml              ok\n'+
      'write   ~/.claude.json                    ok\n'+
      'verify  all 2 files parsed                ok\n'+
      'audit   ~/.mcp-hub/audit.log              ok</pre>'+

      '<h2>侦测</h2>'+
      '<pre>$ mcp-hub-cli doctor\n'+
      'claude-code  ready       ~/.claude.json\n'+
      'codex        ready       ~/.codex/config.toml\n'+
      'vscode       no-config   %APPDATA%/Code/User/mcp.json\n'+
      'grok         orphan      ~/.grok/config.toml\n'+
      'linux        gui-not-supported（按设计仅提供 CLI）</pre>'+

      '<h2>跨机器</h2>'+
      '<pre>$ mcp-hub-cli export --out bundle-win.tar.gz --platform windows\n'+
      '$ mcp-hub-cli import bundle-win.tar.gz\n'+
      '安全：非交互环境 secret_policy 默认 fail，绝不悄悄把密钥写进文件</pre>';
  }

  function render(){
    renderNav(); renderTop();
    var v = document.getElementById('view');
    if(state.page==='matrix') v.innerHTML = viewMatrix();
    else if(state.page==='catalog') v.innerHTML = viewCatalog();
    else if(state.page==='diff') v.innerHTML = viewDiff();
    else if(state.page==='detect') v.innerHTML = viewDetect();
    else if(state.page==='backup') v.innerHTML = viewBackup();
    else v.innerHTML = viewCli();
    bind();
  }

  function go(p){ state.page=p; if(p!=='diff') state.applied=false; render(); }

  /* 深链：index.html#diff 直接打开对应页面，便于分享单屏 */
  function fromHash(){
    var h = (location.hash||'').replace('#','');
    for(var i=0;i<PAGES.length;i++) if(PAGES[i][0]===h) return h;
    return null;
  }

  function bind(){
    var nav = document.getElementById('nav');
    nav.onclick = function(e){
      var b = e.target.closest('button[data-page]');
      if(b) go(b.dataset.page);
    };
    var v = document.getElementById('view');

    v.querySelectorAll('.cell').forEach(function(c){
      c.onclick = function(){
        var k = c.dataset.k;
        state.selected[k] = !state.selected[k];
        if(!state.selected[k]) delete state.selected[k];
        render();
      };
    });
    var ap = document.getElementById('apply');
    if(ap) ap.onclick = function(){ go('diff'); };
    var gc = document.getElementById('goCli');
    if(gc) gc.onclick = function(){ go('cli'); };
    var cf = document.getElementById('confirm');
    if(cf) cf.onclick = function(){ state.applied=true; render(); };
    var bm = document.getElementById('backMatrix');
    if(bm) bm.onclick = function(){ go('matrix'); };
    var ps = document.getElementById('polSel');
    if(ps) ps.onchange = function(e){ state.secretPolicy=e.target.value; render(); };
    var ms = document.getElementById('mergeSel');
    if(ms) ms.onchange = function(e){ state.mergeMode=e.target.value; render(); };
    v.querySelectorAll('button[data-e]').forEach(function(b){
      b.onclick = function(){ state.curEntry=b.dataset.e; render(); };
    });

    /* 服务目录：编辑即改清单，不整体重渲染（避免输入框失焦） */
    if(state.page==='catalog'){
      var ce = entryByName(state.curEntry);
      if(ce){
        v.querySelectorAll('[data-f]').forEach(function(inp){
          if(inp.tagName==='SELECT'){
            inp.onchange = function(){
              applyField(ce, inp.dataset.f, inp.value);
              if(inp.dataset.f==='scope') render();
            };
          }else{
            inp.oninput = function(){ applyField(ce, inp.dataset.f, inp.value); };
          }
        });
        var tr = v.querySelector('[data-f="transport"]');
        if(tr) tr.onchange = function(){ ce.transport = tr.value; render(); };
        var sv = document.getElementById('saveEntry');
        if(sv) sv.onclick = function(){
          var h = document.getElementById('saveHint');
          if(h){ h.textContent = '已保存 · customer-mcp.yaml'; h.style.color = 'var(--green)'; }
        };
        var dl = document.getElementById('delEntry');
        if(dl) dl.onclick = function(){
          var i = ENTRIES.indexOf(ce);
          if(i>=0) ENTRIES.splice(i,1);
          Object.keys(PRE).forEach(function(k){ if(k.indexOf(ce.name+'::')===0) delete PRE[k]; });
          state.curEntry = ENTRIES.length ? ENTRIES[0].name : '';
          render();
        };
        var ad = document.getElementById('addEntry');
        if(ad) ad.onclick = function(){
          var n='new-server', k=2;
          while(entryByName(n)){ n='new-server-'+(k++); }
          ENTRIES.push({name:n, desc:'新建条目', transport:'stdio', command:'npx', args:[], tags:[]});
          state.curEntry = n; render();
        };
      }
    }
  }

  var startPage = fromHash();
  if(startPage) state.page = startPage;
  render();
})();
</script>
</body>
</html>
